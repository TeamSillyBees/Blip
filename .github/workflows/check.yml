name: Check

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/blip
      - run: npm test
      - run: npm run build:npm:current
        if: runner.os == 'Windows'
        env:
          BLIP_RELEASE_TAG: ${{ inputs.release_tag }}
      - run: npm run test:npm-install
        if: runner.os == 'Windows'
      - name: Save tested npm packages
        if: runner.os == 'Windows' && inputs.release_tag != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-release
          path: dist/npm/
          if-no-files-found: error
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
