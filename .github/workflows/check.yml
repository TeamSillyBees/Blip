name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/blip
      - run: npm test
      - run: npm run build:npm:current
      - run: npm run test:npm-install
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
